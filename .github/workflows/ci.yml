name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Report known advisories in production dependencies without failing the build on a new one.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --with-deps fetches system packages (mostly fonts) from Ubuntu's mirrors. When a runner
      # cannot resolve them, apt retries for many minutes, so give it four and then install the
      # browser alone: the runner image already carries the libraries Chromium needs.
      - name: Install Chromium
        run: |
          if ! timeout 240 pnpm exec playwright install --with-deps chromium; then
            echo "::warning::Could not install Chromium's system packages in time; using the runner's own libraries"
            pnpm exec playwright install chromium
          fi
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            .data/e2e-report
            .data/e2e-results
          retention-days: 7
