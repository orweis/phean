name: Release the Claude plugin

# Copies plugin/ into the public plugin repository, which Anthropic's directory and
# `/plugin marketplace add` read. Runs when a release tag made by `claude plugin tag plugin --push`
# (phean--v<version>) arrives, or by hand for a tag that already exists.
#
# Needs, in this repository's settings:
# - the secret PLUGIN_REPO_TOKEN: a fine-grained token with Contents read and write on the public
#   repository only (see docs/plugin/local-tasks/01-public-repository.md);
# - optionally the variable PLUGIN_REPO (owner/name), which defaults to orweis/phean-plugin.

on:
  push:
    tags: ["phean--v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, such as phean--v0.1.0"
        required: true

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PLUGIN_REPO: ${{ vars.PLUGIN_REPO || 'orweis/phean-plugin' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate the plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.330 plugin validate plugin --strict --profile directory

      - name: Check the tag names the manifest's version
        run: |
          version=$(node -p 'require("./plugin/.claude-plugin/plugin.json").version')
          if [ "$TAG" != "phean--v$version" ]; then
            echo "::error::Tag $TAG does not match plugin.json version $version (expected phean--v$version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the copies of the skills are current
        run: |
          diff -r skills plugin/skills
          cmp LICENSE plugin/LICENSE

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUGIN_REPO }}
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: public-plugin

      - name: Copy the plugin and push the release
        working-directory: public-plugin
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../plugin/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Release phean $VERSION" -m "From ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push origin HEAD
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG already exists in $PLUGIN_REPO"
          else
            git tag -a "$TAG" -m "phean $VERSION"
            git push origin "refs/tags/$TAG"
          fi
