org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true

# The Phean deployment the app opens and verifies its links against. Override per build with
# `./gradlew assembleRelease -Pphean.host=phean.example`.
phean.host=phean-alpha.vercel.app

# The app's version, major.minor.patch; versionCode = major * 10000 + minor * 100 + patch.
# Tagged android-v<version> on release.
phean.version=0.1.0
