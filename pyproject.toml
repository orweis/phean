[project]
name = "phean"
version = "0.1.0"
description = "Phean - a Sisyphean-proof task & goal management MCP server. You point at the hill; the agent rolls the boulder."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Or Weis" }]
keywords = ["mcp", "tasks", "goals", "agent", "productivity"]
dependencies = ["fastmcp>=2.0"]

[project.urls]
Repository = "https://github.com/orweis/phean"

[project.scripts]
phean = "phean.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phean"]

[dependency-groups]
dev = ["pytest>=8"]
